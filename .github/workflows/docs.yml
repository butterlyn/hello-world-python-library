# Builds the Great Docs site on every pull request and push to main, and publishes
# it to GitHub Pages from main. Started from `great-docs setup-github-pages`, then
# changed to install Great Docs and Quarto from uv.lock and to pin every action.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request builds, but never a Pages deployment in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, so Great Docs can date pages from Git
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # The same command as the prek hook. Quarto comes from the locked quarto-cli package.
      - name: Build docs
        run: uv run --locked --group docs great-docs build
      # Named docs-html so `great-docs preview --pr <number>` can download it.
      - name: Save docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true
      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.number }}
        run: uv run --locked --group docs great-docs ci notice --run "$RUN_ID" --pr "$PR_NUMBER"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
