[project]
name = "hello-world-python-library"
version = "0.1.0"
description = "A tiny example library that ships a hello-world command-line tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.5.1",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://butterlyn.github.io/hello-world-python-library/"
Repository = "https://github.com/butterlyn/hello-world-python-library"
Issues = "https://github.com/butterlyn/hello-world-python-library/issues"

[project.scripts]
hello-world = "hello_world_python_library.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the README's icon in the source distribution so the README renders when unpacked.
source-include = ["assets/icon.svg"]

[tool.uv.config-settings-package]
# quarto-cli is published only as a source distribution, which downloads Quarto and
# packs it into a wheel. Setuptools' default bdist directory (build/bdist.<platform>/wheel)
# pushes Quarto's deepest files past Windows' 260-character path limit; a one-letter
# bdist directory keeps them under it. The option is harmless on Linux and macOS.
quarto-cli = { "--build-option" = "--bdist-dir=w" }

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "library-skills>=0.0.21",
    "tox>=4.67.15",
    "tox-uv>=1.37.9",
]
docs = [
    "great-docs>=0.17.0",
    "quarto-cli>=1.11.9",
]
lint = [
    "prek>=0.5.11",
]
test = [
    "pytest>=9.2.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# The formatter owns line length; E501 would also flag long lines it cannot wrap.
ignore = ["E501"]
