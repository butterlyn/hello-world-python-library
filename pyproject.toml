[project]
name = "hello-world-python-library"
version = "0.1.0"
description = "A tiny example library that ships a hello-world command-line tool."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.5.1",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://butterlyn.github.io/hello-world-python-library/"
Repository = "https://github.com/butterlyn/hello-world-python-library"
Issues = "https://github.com/butterlyn/hello-world-python-library/issues"

[project.scripts]
hello-world = "hello_world_python_library.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Hatchling also adds pyproject.toml, the README, the license and .gitignore. The wheel
# is built from the source distribution, so it needs skills/; the icon lets the README
# render when unpacked.
only-include = ["src", "skills", "assets/icon.svg"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the agent skill in the wheel where library-skills looks for skills in installed
# packages: <package>/.agents/skills/<name>/SKILL.md.
"skills" = "hello_world_python_library/.agents/skills"

[tool.uv]
# The editable install that `uv sync` makes copies skills/ into .venv instead of
# linking it, because the skill sits outside the package folder. Reinstall the project
# whenever a file in skills/ changes, so `uv run pytest` checks the current skill.
# The first two keys keep uv's defaults (it also watches setup.py and setup.cfg).
cache-keys = [
    { file = "pyproject.toml" },
    { dir = "src" },
    { file = "skills/**/*" },
]

[tool.uv.config-settings-package]
# quarto-cli is published only as a source distribution, which downloads Quarto and
# packs it into a wheel. Setuptools' default bdist directory (build/bdist.<platform>/wheel)
# pushes Quarto's deepest files past Windows' 260-character path limit; a one-letter
# bdist directory keeps them under it. The option is harmless on Linux and macOS.
quarto-cli = { "--build-option" = "--bdist-dir=w" }

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "library-skills>=0.0.21",
    "tox>=4.67.15",
    "tox-uv>=1.37.9",
]
docs = [
    "great-docs>=0.17.0",
    "quarto-cli>=1.11.9",
]
lint = [
    "prek>=0.5.11",
]
test = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# The formatter owns line length; E501 would also flag long lines it cannot wrap.
ignore = ["E501"]
