# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Every hook runs in one or both stages:
# - "pre-commit": runs on `git commit` and `prek run`, and fixes what it can.
# - "manual": runs on `tox -e lint` (`prek run --stage manual`), and only checks.

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", stages = ["pre-commit"] },
    { id = "trailing-whitespace", alias = "trailing-whitespace-check", name = "check trailing whitespace", args = ["--check"], stages = ["manual"] },
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    { id = "end-of-file-fixer", alias = "end-of-file-check", name = "check end of files", args = ["--check"], stages = ["manual"] },
    { id = "check-added-large-files", stages = ["pre-commit", "manual"] },
    { id = "check-merge-conflict", stages = ["pre-commit", "manual"] },
    { id = "check-toml", stages = ["pre-commit", "manual"] },
    { id = "check-yaml", stages = ["pre-commit", "manual"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "9026c9127e153371d7a78dfcb0c45ae2046a3d10"  # frozen: v0.17.6
hooks = [
    { id = "ruff-check", args = ["--fix"], stages = ["pre-commit"] },
    { id = "ruff-format", stages = ["pre-commit"] },
    { id = "ruff-check", alias = "ruff-check-no-fix", name = "ruff check (no fix)", args = ["--no-fix"], stages = ["manual"] },
    { id = "ruff-format", alias = "ruff-format-check", name = "ruff format (check)", args = ["--diff"], stages = ["manual"] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "00eaed0068329eb6ca6bcb8de7b46c372d8d1c19"  # frozen: 0.13.9
hooks = [
    { id = "uv-lock", stages = ["pre-commit"] },
    { id = "uv-lock", alias = "uv-lock-check", name = "uv lock (check)", args = ["--check"], stages = ["manual"] },
]
